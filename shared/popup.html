<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>GitIt</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="head">
        <div class="brand">
            <img class="logo" src="icons/icon-96.png" width="30" height="30" alt="">
            <div class="words">
                <strong>GitIt</strong>
                <span class="meta" id="meta">Loading…</span>
            </div>
        </div>
        <button class="icon-button" id="check" type="button" title="Check now" aria-label="Check now">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path fill="currentColor" d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/>
            </svg>
        </button>
    </header>

    <nav class="segments" id="segments" role="tablist" aria-label="Show">
        <span class="thumb" id="thumb" aria-hidden="true"></span>
        <button type="button" role="tab" data-tab="issues" aria-selected="false">Issues <span class="n" data-n="issues"></span></button>
        <button type="button" role="tab" data-tab="pulls" aria-selected="false">PRs <span class="n" data-n="pulls"></span></button>
        <button type="button" role="tab" data-tab="activity" aria-selected="false">Activity <span class="n" data-n="activity"></span></button>
    </nav>

    <main id="body" class="body" aria-live="polite"></main>

    <footer class="foot">
        <button class="link" id="all" type="button">See everything</button>
        <a class="link quiet" id="github" href="https://github.com/notifications?query=is%3Aunread">GitHub ↗</a>
    </footer>

    <script src="status.js"></script>
    <script src="popup.js"></script>
</body>
</html>
