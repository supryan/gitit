<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitIt</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="top">
        <div class="brand">
            <img class="logo" src="icon-128.png" width="40" height="40" alt="">
            <div>
                <h1>GitIt</h1>
                <p class="meta" id="meta">Loading…</p>
            </div>
        </div>
        <button class="button" id="check" type="button">Check now</button>
    </header>

    <div class="notice hidden" id="notice"></div>

    <div class="toolbar">
        <nav class="filters" id="filters" aria-label="Show">
            <button type="button" data-filter="all" class="active">All <span class="count" data-count="all">0</span></button>
            <button type="button" data-filter="reviewRequest"><span class="dot reviewRequest"></span>Review <span class="count" data-count="reviewRequest">0</span></button>
            <button type="button" data-filter="notification"><span class="dot notification"></span>Unread <span class="count" data-count="notification">0</span></button>
            <button type="button" data-filter="assigned"><span class="dot assigned"></span>Assigned <span class="count" data-count="assigned">0</span></button>
            <button type="button" data-filter="pullRequest"><span class="dot pullRequest"></span>Your PRs <span class="count" data-count="pullRequest">0</span></button>
        </nav>
        <div class="selects">
            <label class="select">
                <svg class="select-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M1.75 16A1.75 1.75 0 0 1 0 14.25V1.75C0 .784.784 0 1.75 0h8.5C11.216 0 12 .784 12 1.75v12.5c0 .085-.006.168-.018.25h2.268a.25.25 0 0 0 .25-.25V8.285a.25.25 0 0 0-.111-.208l-1.055-.703a.749.749 0 1 1 .832-1.248l1.055.703c.487.325.779.871.779 1.456v5.965A1.75 1.75 0 0 1 14.25 16h-3.5a.766.766 0 0 1-.197-.026c-.099.017-.2.026-.303.026h-3a.75.75 0 0 1-.75-.75V14h-1v1.25a.75.75 0 0 1-.75.75Zm-.25-1.75c0 .138.112.25.25.25H4v-1.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 .75.75v1.25h2.25a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25ZM3.75 6h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5ZM3 3.75A.75.75 0 0 1 3.75 3h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 3 3.75Zm4 3A.75.75 0 0 1 7.75 6h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 7 6.75ZM7.75 3h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5ZM3 9.75A.75.75 0 0 1 3.75 9h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 3 9.75ZM7.75 9h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5Z"/></svg>
                <select id="org" aria-label="Organization"><option value="all">All orgs</option></select>
                <svg class="chevron" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="m4.5 6 3.5 3.5L11.5 6"/></svg>
            </label>
            <label class="select">
                <svg class="select-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>
                <select id="repo" aria-label="Project"><option value="all">All projects</option></select>
                <svg class="chevron" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="m4.5 6 3.5 3.5L11.5 6"/></svg>
            </label>
        </div>
    </div>

    <main id="list" class="list"></main>

    <footer class="links">
        <span>On GitHub</span>
        <a href="https://github.com/pulls/review-requested" target="_blank" rel="noopener">Review requests</a>
        <a href="https://github.com/pulls?q=is%3Apr+is%3Aopen+involves%3A%40me+sort%3Aupdated-desc" target="_blank" rel="noopener">Pull requests</a>
        <a href="https://github.com/issues?q=is%3Aissue+is%3Aopen+involves%3A%40me+sort%3Aupdated-desc" target="_blank" rel="noopener">Issues</a>
        <a href="https://github.com/notifications?query=is%3Aunread" target="_blank" rel="noopener">Notifications</a>
    </footer>

    <script src="status.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
