<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitIt</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="top">
        <div class="title">
            <h1>
                <svg class="logo" viewBox="0 0 16 16" width="34" height="34" aria-hidden="true">
                    <path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
                </svg>
                GitIt
            </h1>
            <p class="meta" id="meta">Loading…</p>
        </div>
        <div class="actions">
            <button id="check" type="button">Check now</button>
        </div>
    </header>

    <div class="notice hidden" id="notice"></div>

    <nav class="filters" id="filters">
        <button type="button" data-filter="all" class="active">All <span class="count" data-count="all">0</span></button>
        <button type="button" data-filter="reviewRequest">Review requested <span class="count" data-count="reviewRequest">0</span></button>
        <button type="button" data-filter="notification">Unread activity <span class="count" data-count="notification">0</span></button>
        <button type="button" data-filter="assigned">Assigned <span class="count" data-count="assigned">0</span></button>
        <button type="button" data-filter="pullRequest">Your pull requests <span class="count" data-count="pullRequest">0</span></button>
    </nav>

    <main id="list" class="list"></main>

    <footer class="links">
        <span>On GitHub:</span>
        <a href="https://github.com/pulls/review-requested" target="_blank" rel="noopener">Review requests</a>
        <a href="https://github.com/pulls?q=is%3Apr+is%3Aopen+involves%3A%40me+sort%3Aupdated-desc" target="_blank" rel="noopener">Pull requests</a>
        <a href="https://github.com/issues?q=is%3Aissue+is%3Aopen+involves%3A%40me+sort%3Aupdated-desc" target="_blank" rel="noopener">Issues</a>
        <a href="https://github.com/notifications?query=is%3Aunread" target="_blank" rel="noopener">Notifications</a>
    </footer>

    <script src="dashboard.js"></script>
</body>
</html>
